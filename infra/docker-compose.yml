version: '3.8'

services:
  # ----------------------------------------
  # PostgreSQL (Single Container, 3 DBs)
  # ----------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: invsys-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Mount the init script to create the 3 bounded context databases automatically
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Auth Service (NestJS)
  # ----------------------------------------
  auth-service:
    build:
      context: ../services/auth-service
      dockerfile: Dockerfile
    container_name: invsys-auth
    ports:
      - "3001:3001"
    env_file:
      - .env
    environment:
      - AUTH_DB_HOST=postgres
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy

  # ----------------------------------------
  # Product Service (NestJS)
  # ----------------------------------------
  product-service:
    build:
      context: ../services/product-service
      dockerfile: Dockerfile
    container_name: invsys-product
    ports:
      - "3002:3002"
    env_file:
      - .env
    environment:
      - PRODUCTS_DB_HOST=postgres
      - REDIS_HOST=redis
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started

  # ----------------------------------------
  # Inventory Service (Golang)
  # ----------------------------------------
  inventory-service:
    build:
      context: ../services/inventory-service
      dockerfile: Dockerfile
    container_name: invsys-inventory
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - INVENTORY_DB_HOST=postgres
      - KAFKA_BROKER_URL=kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started

  # ----------------------------------------
  # Redis (Cache)
  # ----------------------------------------
  redis:
    image: redis:7-alpine
    container_name: invsys-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_CACHE_PASSWORD:-secret}
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_CACHE_PASSWORD:-secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ----------------------------------------
  # Message Broker (Kafka via KRaft - Secured)
  # ----------------------------------------
  kafka:
    image: apache/kafka:latest
    container_name: invsys-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  kafka_data:
