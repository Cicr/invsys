basePath: /api/v1
definitions:
  models.InventoryItem:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      productId:
        type: string
      quantity:
        type: integer
      updatedAt:
        type: string
    type: object
  models.StockMutationRequest:
    properties:
      productId:
        type: string
      quantity:
        type: integer
    required:
    - productId
    - quantity
    type: object
host: localhost:8080
info:
  contact: {}
  description: High-throughput inventory tracking and CQRS management via Golang.
  title: Inventory Service API
  version: "1.0"
paths:
  /health:
    get:
      description: responds with status ok
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health Check
      tags:
      - health
  /inventory/add:
    post:
      consumes:
      - application/json
      description: Add quantity to a product's inventory
      parameters:
      - description: Stock Add Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.StockMutationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.InventoryItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Add Stock
      tags:
      - inventory
  /inventory/deduct:
    post:
      consumes:
      - application/json
      description: Deduct quantity from a product's inventory
      parameters:
      - description: Stock Deduct Request
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/models.StockMutationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.InventoryItem'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Deduct Stock
      tags:
      - inventory
swagger: "2.0"
